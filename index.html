<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <meta name="screen-orientation" content="landscape"/>
  <title>KiPi re.web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="hudButtons">
  <div class="iconBtn" id="btnPause" style="display:none" title="Pause (P)">
    <svg viewBox="0 0 24 24" id="icoPause"><path d="M9 5v14M15 5v14"/></svg>
    <svg viewBox="0 0 24 24" id="icoResume" style="display:none"><path d="M8 5l11 7-11 7z"/></svg>
  </div>
  <div class="iconBtn" id="btnAudio" title="Sound (M)">
    <svg viewBox="0 0 24 24" id="icoSoundOn"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    <svg viewBox="0 0 24 24" id="icoSoundOff" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
  </div>
</div>

<div id="rotateNotice">Rotate your device to landscape to play.</div>
    <link rel="stylesheet" href="main.css">
    <script src="script.js"></script>
</body>
</html>
